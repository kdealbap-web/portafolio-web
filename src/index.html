  <style>
    /* The ground the veil stands on, painted before Angular exists.

       Without this the page would paint its content, and the veil would then
       appear on top of something the visitor had already started reading —
       worse than no veil at all. So the backdrop goes up with the first frame
       and the component fades the whole thing out when its signals resolve.

       The animation is a dead-man's switch, not decoration: if the bundle
       never boots, nothing is left holding a black rectangle over the page.
       The component normally removes `.intro` long before this fires. */
    html.intro::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 59;
      background: #070e11;
      animation: kda-reveal 360ms ease 2400ms forwards;
    }

    @keyframes kda-reveal {
      to { opacity: 0; visibility: hidden; }
    }

    @media (prefers-reduced-motion: reduce) {
      html.intro::before { animation-delay: 1400ms; animation-duration: 1ms; }
    }
  </style>
  <script>
    /* Decides whether the veil runs, before the first paint: once per session,
       and nothing at all if this script does not run. Reduced motion still
       gets the veil — it reports real state and carries a status line — it
       just gets it without any of the movement. */
    try {
      if (!sessionStorage.getItem('kda.intro')) {
        document.documentElement.classList.add('intro');
        sessionStorage.setItem('kda.intro', '1');
      }
    } catch (e) {}
  </script>

</body>
